# 编译、离线回归和标签发版。真实任务栏与播放器行为仍需在 Windows 上验证。
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 校验发布版本
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [xml]$project = Get-Content wpf/TaskbarLyrics/TaskbarLyrics.csproj -Raw
          $version = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "标签 $env:RELEASE_TAG 与项目版本 v$version 不一致"
          }
          $heading = '(?m)^## ' + [regex]::Escape($version) + ' — \d{4}-\d{2}-\d{2}\r?$'
          if ((Get-Content CHANGELOG.md -Raw) -notmatch $heading) {
            throw "CHANGELOG.md 缺少 $version 的更新说明"
          }

      - name: 编译
        run: dotnet build wpf/TaskbarLyrics -c Release

      - name: 验证歌词绘制 Hook
        shell: pwsh
        run: |
          & wpf/TaskbarLyrics/obj/native/Release/LyricsHookProbe.exe (Resolve-Path wpf/TaskbarLyrics/obj/native/Release/TaskbarLyricsHook19.dll)
          if ($LASTEXITCODE -ne 0) { throw "歌词绘制 Hook 离线验证失败" }

      - name: 验证歌词选句与设置
        run: dotnet run --project tests/TaskbarLyrics.Tests -c Release

      # 与 README / 发布用的命令保持一致：框架依赖单文件，包含 Skia 原生库，不自包含 .NET。
      - name: 打包
        run: >
          dotnet publish wpf/TaskbarLyrics -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: TaskbarLyrics-win-x64
          path: publish/TaskbarLyrics.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: TaskbarLyrics-win-x64
          path: publish

      - name: 提取更新说明
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['RELEASE_TAG'].removeprefix('v')
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          section = re.search(
              rf'^## {re.escape(version)} — [^\n]+\n(.*?)(?=^## |\Z)',
              changelog, re.MULTILINE | re.DOTALL)
          if section is None:
              raise SystemExit(f'缺少 {version} 的更新说明')
          Path('release-notes.md').write_text(section.group(1).strip() + '\n', encoding='utf-8')
          PY

      - name: 创建 Release 并上传程序
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >
          gh release create "$RELEASE_TAG" publish/TaskbarLyrics.exe
          --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
